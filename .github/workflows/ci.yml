name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CC: "ccache gcc"
  CXX: "ccache g++"
  CCACHE_DIR: "${{ github.workspace }}/.cache/ccache"
  CCACHE_BASEDIR: "${{ github.workspace }}"
  CCACHE_NOHASHDIR: "true"
  MAKEFLAGS: "-j1"

jobs:
  ci:
    name: Toolchain Doctor, Lint & Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system HDL packages (Verilator, Yosys, ccache)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ccache git verilator yosys libevent-dev libjson-c-dev

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Python virtualenv (.venv)
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('pyproject.toml', 'toolchain.lock') }}

      - name: Install Python dependencies & pinned LiteX commits
        run: |
          if [ ! -x .venv/bin/python ]; then
            python -m venv .venv
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/python -m pip install -e ".[dev]"
            .venv/bin/python -m pip install \
              "git+https://github.com/enjoy-digital/litex.git@9187839f2d275352ef6f0d7ab14431e2a66b8f81" \
              "git+https://github.com/enjoy-digital/litedram.git@f2d22975d67229676e10308ae6e71b819b6afe42" \
              "git+https://github.com/enjoy-digital/liteeth.git@9712c3899c4b9d162aca5aef403889ab2c8c4542"
          else
            .venv/bin/python -m pip install --no-deps -e .
          fi
          .venv/bin/yowasp-nextpnr-ecp5 --version

      - name: Cache ccache, Verilator builds, & Yosys/nextpnr synthesis results
        uses: actions/cache@v4
        with:
          path: |
            .cache/ccache
            .cache/synth
            sim_build/.verilator_cache
          key: hdl-cache-${{ runner.os }}-${{ hashFiles('toolchain.lock') }}-${{ github.sha }}
          restore-keys: |
            hdl-cache-${{ runner.os }}-${{ hashFiles('toolchain.lock') }}-

      - name: Verify toolchain lockfile
        run: .venv/bin/python scripts/doctor.py

      - name: Run Ruff linter
        run: .venv/bin/ruff check .

      - name: Run Ruff format check
        run: .venv/bin/ruff format --check .

      - name: Run parallel pytest suite
        run: .venv/bin/pytest -n auto --dist loadfile

      - name: Verify deterministic synthesis & nextpnr-ecp5 resource report
        run: .venv/bin/python scripts/resource_report.py --check
